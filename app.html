<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Petrocal App</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="brand-bar">
      <h1><a class="brand-home-link" href="index.html" aria-label="Go to Petrocal home"><img src="res/logo.svg" alt="Petrocal" class="brand-logo" /></a></h1>
    </header>
    <header class="top-bar">
      <div class="dataset-actions">
        <button id="clearDatasetBtn" class="btn btn-with-icon"><img class="btn-icon" src="res/icon-new.svg" alt="" aria-hidden="true" /><span>New</span></button>
        <button id="loadDatasetBtn" class="btn btn-with-icon"><img class="btn-icon" src="res/icon-load.svg" alt="" aria-hidden="true" /><span>Load</span></button>
        <button id="saveDatasetBtn" class="btn btn-with-icon"><img class="btn-icon" src="res/icon-save.svg" alt="" aria-hidden="true" /><span>Save</span></button>
        <a class="btn nav-link-btn btn-with-icon" href="report.html"><img class="btn-icon" src="res/icon-report.svg" alt="" aria-hidden="true" /><span>Report</span></a>
        <a class="btn nav-link-btn btn-with-icon" href="form6.html"><img class="btn-icon" src="res/icon-form6.svg" alt="" aria-hidden="true" /><span>Form 6</span></a>
        <input id="datasetFileInput" type="file" accept=".cal,.json,application/json" data-schema-name="datasetFile" hidden />
      </div>
      <div class="header-right">
        <div id="saveStatus" class="save-status">Not saved yet</div>
      </div>
    </header>

    <nav class="tab-bar" role="tablist" aria-label="Sections">
      <button class="tab active" data-tab="testDetails">Test Details</button>
      <button class="tab" data-tab="measures">Measures</button>
      <button class="tab" data-tab="instruments">Instruments</button>
      <button class="tab" data-tab="hoses">Hoses</button>
    </nav>

    <main id="appMain">
      <section id="testDetails" class="tab-panel active"></section>
      <section id="measures" class="tab-panel"></section>
      <section id="instruments" class="tab-panel"></section>
      <section id="hoses" class="tab-panel"></section>
    </main>

    <footer>
      <hr/>
      <p>&copy; Copyright 2026 Ben Renegar</p>
    </footer>

    <script src="app/app.js"></script>
  </body>
</html>
