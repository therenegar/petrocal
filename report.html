<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PetroCAL — Test Report</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" media="print" href="css/print.css" />
    <link rel="icon" type="image/png" href="res/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="res/favicon.svg" />
    <link rel="shortcut icon" href="res/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="res/apple-touch-icon.png" />
    <link rel="manifest" href="res/site.webmanifest" />
  </head>
  <body>
    <header class="brand-bar no-print">
      <h1><a class="brand-home-link" href="index.html" aria-label="Go to Petrocal home"><img src="res/logo.svg" alt="Petrocal" class="brand-logo" /></a></h1>
    </header>
    <header class="top-bar no-print">
      <div class="dataset-actions">
        <a class="btn nav-link-btn" href="app.html">← Back to Worksheet</a>
        <span class="separator">|</span>
        <button class="btn nav-link-btn" type="button" onclick="window.print()">Print Report</button>
        <span id="exportStatus" class="export-status" role="status" aria-live="polite"></span>

      <div class="header-right"></div>
    </header>

    <main id="appMain" class="report-page">
      <div class="report-print-header">

        &nbsp;
        <img src="res/logo.svg" alt="Petrocal" class="print-only" />
      </div>
      <h1 class="header-licensee print-only">{businessName}</h1>
      <h1>Test Report</h1>
      <section id="reportContent" class="tab-panel active report-output"></section>
    </main>

        <footer>
      <hr/>
      <p>&copy; Copyright 2026 Ben Renegar</p>
    </footer>

    <script>
      window.PETROCAL_EXPORT_BASE_URL = "http://localhost:8080/petrocal/tools";

    <script src="app/report.js"></script>
